name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4_mobile/android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      # Uses a debug-signed release build so CI doesn't need your real signing
      # secrets. Swap this for `assembleRelease` + KEYSTORE_PATH/STORE_PASSWORD/
      # KEY_PASSWORD repo secrets once you have a real upload keystore.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seka-android-apk
          path: 4_mobile/android-app/app/build/outputs/apk/debug/app-debug.apk

  build-frontend:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 3_frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Zip website build
        run: cd dist && zip -r ../../seka-website.zip .

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: seka-website
          path: seka-website.zip

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: 4_ios/Sekaa
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app
      - run: brew install xcodegen
      - name: Decode GoogleService-Info.plist
        env:
          GOOGLESERVICE_PLIST_B64: ${{ secrets.IOS_GOOGLESERVICE_PLIST }}
        run: echo "$GOOGLESERVICE_PLIST_B64" | base64 --decode > GoogleService-Info.plist
      - run: xcodegen generate
      - run: xcodebuild -resolvePackageDependencies -project Sekaa.xcodeproj -scheme Sekaa
      - name: Build (Debug, iOS Simulator)
        run: |
          xcodebuild build \
            -project Sekaa.xcodeproj \
            -scheme Sekaa \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r seka-ios-simulator.zip Sekaa.app
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: seka-ios-simulator
          path: 4_ios/Sekaa/build/Build/Products/Debug-iphonesimulator/seka-ios-simulator.zip
      - name: Package unsigned .ipa
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          mkdir -p Payload
          cp -R Sekaa.app Payload/
          zip -r seka-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: seka-ios-ipa
          path: 4_ios/Sekaa/build/Build/Products/Debug-iphonesimulator/seka-unsigned.ipa
  release:
    name: Create GitHub Release
    needs: [build-android, build-frontend, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/seka-android-apk/app-debug.apk
            artifacts/seka-website/seka-website.zip
            artifacts/seka-ios-simulator/seka-ios-simulator.zip
            artifacts/seka-ios-ipa/seka-unsigned.ipa

