name: iOS Build
on:
  push:
    branches: [main]
    paths:
      - '4_ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - '4_ios/**'
jobs:
  ios:
    name: iOS app build (Xcode)
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: 4_ios/Sekaa
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLESERVICE_PLIST_B64: ${{ secrets.IOS_GOOGLESERVICE_PLIST }}
        run: |
          if [ -z "$GOOGLESERVICE_PLIST_B64" ]; then
            echo "IOS_GOOGLESERVICE_PLIST secret not set - skipping plist decode."
            echo "Add it in repo Settings > Secrets > Actions before this build can succeed."
            exit 1
          fi
          echo "$GOOGLESERVICE_PLIST_B64" | base64 --decode > GoogleService-Info.plist

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Sekaa.xcodeproj \
            -scheme Sekaa || echo "No .xcodeproj yet - see note below"

      - name: Build (Debug, iOS Simulator)
        run: |
          xcodebuild build \
            -project Sekaa.xcodeproj \
            -scheme Sekaa \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
