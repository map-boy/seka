name: Sekaa
options:
  bundleIdPrefix: com.sekaa
  deploymentTarget:
    iOS: "17.0"
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Sekaa:
    type: application
    platform: iOS
    sources:
      - path: Models
      - path: Services
      - path: Views
      - path: SekaaApp.swift
    resources:
      - path: GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sekaa.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: 5.0
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseStorage